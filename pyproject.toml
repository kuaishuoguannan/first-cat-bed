[project]
name = "pomodoro-clock"
version = "1.0.0"
description = "A modern desktop Pomodoro timer application"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Pomodoro Clock Team", email = "pomodoro@example.com"}
]

dependencies = [
    "PyQt6>=6.6.0",
    "pyqt6-tools>=6.6.0",
    "pygame>=2.5.0",
    "plyer>=2.1.0",
    "pystray>=0.19.5",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "python-dateutil>=2.8.2",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "autopep8>=2.0.0",
    "pylint>=3.0.0",
    "pytest>=7.0.0",
    "black>=24.0.0",
    "isort>=5.12.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pylint.master]
# 忽略一些PyQt6特有的警告
disable = """
    too-many-instance-attributes,
    too-many-public-methods,
    too-many-lines,
    too-many-arguments,
    too-many-branches,
    too-many-locals,
    too-many-statements,
    fixme,
    missing-docstring,
    invalid-name,
    line-too-long
"""

[project.scripts]
pomodoro-clock = "src.main:main"